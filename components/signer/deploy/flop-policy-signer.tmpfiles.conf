# Secret material is root-owned. The Reader cannot access this directory.
d /var/lib/flop-policy-signer-secret 0700 root root -

# Public Technocore snapshots are written by the Reader and read by the Signer.
# setgid keeps new atomic replacement files in the shared acquisition group.
d /var/lib/flop-policy-signer-input 2750 flop-signer-reader flop-signer-acquisition -
